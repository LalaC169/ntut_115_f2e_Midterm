<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>狗等了｜等一場散步，也等一個家</title>
    <link href="style.css" rel="stylesheet" />
    <script defer="" src="script.js"></script>
    <script defer="" src="tail.js"></script>
  </head>
  <body>
    <header class="header">
      <a aria-label="狗等了首頁" class="brand" href="index.html">
        <img alt="狗等了" src="assets/logo.png" />
      </a>
      <nav aria-label="主選單">
        <a aria-current="page" class="english" href="index.html"> home </a>
        <a href="dogs.html"> 認識狗狗 </a>
        <a href="volunteer.html"> 我要當志工 </a>
        <a data-tail="adoption" href="adoption.html"> 領養資訊 </a>
      </nav>
    </header>
    <main>
      <section aria-label="狗等了" class="hero">
        <p class="slogan">你的一點時間，變成牠開心的一天。</p>
        <div aria-label="開心搖尾巴的黑色唐狗" class="dog" role="img">
          <img alt="" class="body" src="assets/dog-body.png" />
          <div
            aria-label="摸摸尾巴，牠會搖得更快"
            class="tail-area"
            tabindex="0"
          >
            <img alt="" class="tail" src="assets/dog-tail.png" />
          </div>
        </div>
        <!-- 志工入口：文字環繞球旋轉，滑鼠移入或鍵盤聚焦時暫停。 -->
        <a
          class="volunteer-ball"
          href="volunteer.html"
          aria-label="陪牠玩，加入志工"
        >
          <svg class="ball-label" viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <path
                id="ball-text-circle"
                d="M 100,100 m -83,0 a 83,83 0 1,1 166,0 a 83,83 0 1,1 -166,0"
              />
            </defs>
            <text><textPath href="#ball-text-circle" startOffset="5%">陪牠玩</textPath><textPath href="#ball-text-circle" startOffset="53%">加入志工</textPath></text>
          </svg>
          <img class="ball-image" src="assets/ball.png" alt="" />
        </a>
      </section>
      <section aria-labelledby="waiting-title" class="waiting">
        <div class="intro">
          <h1 id="waiting-title">牠們，正在等你。</h1>
          <p>等一場散步，也等一個家。</p>
          <a class="text-link" href="dogs.html"> 認識等待中的牠們 → </a>
        </div>
        <div class="counter">
          <strong data-total="30" id="count"> 30 </strong>
          <span> 隻狗狗等待中 </span>
        </div>
      </section>
    </main>
    <footer>
      <div class="contact-heading">
        <span class="english"> CONTACT </span>
        <span> 聯絡我們 </span>
      </div>
      <img
        alt="鑽進洞裡的可愛狗狗"
        class="footer-dog"
        src="assets/footer-dog.png"
      />
      <div aria-label="社群聯絡方式" class="socials">
        <button data-page="Facebook 連結">ⓕ Facebook</button>
        <button data-page="Instagram 連結">◎ Instagram</button>
        <button data-page="LINE 連結">LINE</button>
        <button data-page="Email 地址">✉ Email</button>
      </div>
    </footer>
    <dialog id="notice">
      <p id="notice-text"></p>
      <button id="close-notice">知道了</button>
    </dialog>
  </body>
</html>
